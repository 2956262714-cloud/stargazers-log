<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="我已标注的 GitHub 仓库日志">
    <title>Stargazers log</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="page-header">
        <p class="eyebrow">PERSONAL INDEX / 2026</p>
        <h1>Stargazers log</h1>
        <p class="intro">我已标注的仓库，按最近收藏的顺序排列。</p>
      </header>

      <section aria-labelledby="repositories-heading">
        <div class="section-heading">
          <h2 id="repositories-heading">Starred repositories</h2>
          <span id="repository-count" class="count" aria-live="polite">加载中...</span>
        </div>
        <div id="repository-list" class="repository-list" aria-live="polite">
          <p class="status-message">正在读取仓库记录...</p>
        </div>
      </section>
    </main>
  </body>
</html>
